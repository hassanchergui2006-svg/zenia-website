<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Capsules bottle -->
    <linearGradient id="cap-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A3D28"/>
      <stop offset="40%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#1A3D28"/>
    </linearGradient>
    <linearGradient id="cbody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1008"/>
      <stop offset="25%" stop-color="#3D2410"/>
      <stop offset="60%" stop-color="#4A2E18"/>
      <stop offset="100%" stop-color="#1C1008"/>
    </linearGradient>
    <linearGradient id="clabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F5EE"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>
    <linearGradient id="bio-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#174326"/>
    </linearGradient>
    <!-- Gummies jar -->
    <linearGradient id="jglass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5CEC5" stop-opacity="0.65"/>
      <stop offset="20%" stop-color="#EDE7DC" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#E8E2D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C5BEB5" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="jlid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDD8D2"/>
    </linearGradient>
    <linearGradient id="jlabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </linearGradient>
    <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="gr2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <!-- Background -->
    <radialGradient id="bg-glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#DDE8D2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F7F0E6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft background -->
  <rect width="600" height="500" fill="url(#bg-glow)"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="80" r="4" fill="#B58BD6" opacity="0.3"/>
  <circle cx="540" cy="100" r="5" fill="#6F8B61" opacity="0.25"/>
  <circle cx="80" cy="420" r="6" fill="#E9CF62" opacity="0.35"/>
  <circle cx="520" cy="400" r="5" fill="#B58BD6" opacity="0.3"/>
  <text x="55" y="160" font-size="18" opacity="0.2" fill="#174326">✦</text>
  <text x="530" y="180" font-size="14" opacity="0.2" fill="#B58BD6">♡</text>
  <text x="40" y="320" font-size="12" opacity="0.25" fill="#E9CF62">★</text>
  <text x="555" y="300" font-size="16" opacity="0.2" fill="#6F8B61">✦</text>

  <!-- ===== CAPSULES BOTTLE (left, slightly rotated) ===== -->
  <g transform="translate(95, 30) rotate(-5, 115, 230)">
    <!-- Capsule pieces at base -->
    <ellipse cx="50" cy="390" rx="20" ry="8" fill="#DDE8D2" transform="rotate(-30 50 390)" opacity="0.85"/>
    <ellipse cx="80" cy="400" rx="20" ry="8" fill="#E9CF62" transform="rotate(15 80 400)" opacity="0.8"/>
    <ellipse cx="145" cy="395" rx="20" ry="8" fill="#DDE8D2" transform="rotate(-10 145 395)" opacity="0.85"/>
    <ellipse cx="178" cy="398" rx="20" ry="8" fill="#E9CF62" transform="rotate(20 178 398)" opacity="0.8"/>

    <!-- Neck -->
    <rect x="93" y="60" width="55" height="42" rx="5" fill="url(#cbody)"/>
    <!-- Cap -->
    <rect x="83" y="34" width="75" height="34" rx="9" fill="url(#cap-g)"/>
    <ellipse cx="120" cy="34" rx="37" ry="8" fill="#2D5A3D"/>
    <rect x="87" y="50" width="66" height="5" rx="2" fill="#122E1C" opacity="0.35"/>

    <!-- Body -->
    <rect x="65" y="98" width="110" height="260" rx="16" fill="url(#cbody)"/>
    <!-- Shine -->
    <rect x="73" y="106" width="17" height="238" rx="8" fill="white" opacity="0.07"/>

    <!-- Label -->
    <rect x="74" y="120" width="92" height="165" rx="7" fill="url(#clabel)"/>
    <rect x="74" y="120" width="92" height="165" rx="7" fill="none" stroke="#6F8B61" stroke-width="1.4"/>
    <rect x="78" y="124" width="84" height="157" rx="5" fill="none" stroke="#6F8B61" stroke-width="0.4" stroke-dasharray="2,3"/>

    <text x="120" y="143" text-anchor="middle" font-size="12">🌿</text>
    <text x="120" y="161" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#174326" font-style="italic" font-weight="bold">Zenia</text>
    <line x1="82" y1="165" x2="158" y2="165" stroke="#6F8B61" stroke-width="0.7"/>
    <text x="120" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#25221D" font-weight="bold" letter-spacing="1">CAPSULES</text>
    <text x="120" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#25221D" font-weight="bold" letter-spacing="1">ANTI-STRESS</text>
    <line x1="82" y1="195" x2="158" y2="195" stroke="#DDE8D2" stroke-width="0.5"/>
    <text x="120" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#5B3A24">Ashwagandha · Rhodiola</text>
    <text x="120" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#5B3A24">Passiflore</text>
    <circle cx="100" cy="235" r="11" fill="#DDE8D2"/>
    <circle cx="120" cy="235" r="11" fill="#DDE8D2"/>
    <circle cx="140" cy="235" r="11" fill="#DDE8D2"/>
    <text x="100" y="239" text-anchor="middle" font-size="9">😌</text>
    <text x="120" y="239" text-anchor="middle" font-size="9">🧠</text>
    <text x="140" y="239" text-anchor="middle" font-size="9">🌙</text>
    <rect x="80" y="252" width="80" height="14" rx="7" fill="url(#bio-b)"/>
    <text x="120" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#F7F0E6" font-weight="bold">100% NATUREL &amp; BIO</text>
    <text x="120" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="#6F8B61" font-weight="bold">60 CAPSULES</text>
  </g>

  <!-- Label: Concentration & Calme -->
  <rect x="60" y="418" width="155" height="26" rx="13" fill="#DDE8D2" opacity="0.9"/>
  <text x="137" y="435" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#174326" font-style="italic">Concentration &amp; Calme</text>

  <!-- ===== GUMMIES JAR (right, slightly rotated other way) ===== -->
  <g transform="translate(305, 15) rotate(4, 130, 240)">
    <!-- Gummies outside -->
    <circle cx="20" cy="380" r="14" fill="url(#gr)" opacity="0.88"/>
    <circle cx="230" cy="385" r="13" fill="url(#gr2)" opacity="0.88"/>
    <circle cx="10" cy="350" r="11" fill="url(#gr2)" opacity="0.75"/>
    <circle cx="245" cy="355" r="11" fill="url(#gr)" opacity="0.75"/>

    <!-- Lid -->
    <ellipse cx="130" cy="62" rx="82" ry="15" fill="#DDD8D2"/>
    <rect x="48" y="50" width="164" height="28" rx="7" fill="url(#jlid)"/>
    <ellipse cx="130" cy="50" rx="82" ry="15" fill="#FFFFFF"/>
    <!-- Lid lines -->
    <line x1="72" y1="55" x2="72" y2="72" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>
    <line x1="92" y1="52" x2="92" y2="74" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>
    <line x1="112" y1="51" x2="112" y2="76" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>
    <line x1="132" y1="50" x2="132" y2="77" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>
    <line x1="152" y1="51" x2="152" y2="76" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>
    <line x1="172" y1="52" x2="172" y2="74" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>
    <line x1="192" y1="55" x2="192" y2="72" stroke="#D5D0CA" stroke-width="1.2" opacity="0.6"/>

    <!-- Jar body -->
    <rect x="42" y="78" width="176" height="225" rx="14" fill="url(#jglass)"/>

    <!-- Gummies inside -->
    <circle cx="72" cy="112" r="15" fill="url(#gr)" opacity="0.88"/>
    <circle cx="100" cy="98" r="14" fill="url(#gr2)" opacity="0.88"/>
    <circle cx="130" cy="108" r="15" fill="url(#gr)" opacity="0.88"/>
    <circle cx="160" cy="96" r="14" fill="url(#gr2)" opacity="0.88"/>
    <circle cx="188" cy="110" r="14" fill="url(#gr)" opacity="0.88"/>
    <circle cx="70" cy="142" r="14" fill="url(#gr2)" opacity="0.82"/>
    <circle cx="100" cy="132" r="15" fill="url(#gr)" opacity="0.82"/>
    <circle cx="132" cy="142" r="14" fill="url(#gr2)" opacity="0.82"/>
    <circle cx="162" cy="130" r="14" fill="url(#gr)" opacity="0.82"/>
    <circle cx="190" cy="140" r="13" fill="url(#gr2)" opacity="0.82"/>
    <!-- Shine on gummies -->
    <circle cx="67" cy="107" r="4" fill="white" opacity="0.28"/>
    <circle cx="127" cy="103" r="4" fill="white" opacity="0.28"/>
    <circle cx="157" cy="91" r="3" fill="white" opacity="0.28"/>

    <!-- Label -->
    <rect x="52" y="188" width="156" height="98" rx="8" fill="url(#jlabel)" opacity="0.97"/>
    <rect x="52" y="188" width="156" height="98" rx="8" fill="none" stroke="#B58BD6" stroke-width="1.8"/>
    <rect x="56" y="192" width="148" height="90" rx="6" fill="none" stroke="#B58BD6" stroke-width="0.4" stroke-dasharray="2,3"/>

    <text x="130" y="211" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#4E285F" font-style="italic" font-weight="bold">Zenia</text>
    <line x1="62" y1="216" x2="198" y2="216" stroke="#B58BD6" stroke-width="0.8"/>
    <text x="130" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#25221D" font-weight="bold" letter-spacing="1.2">STRESS GUMMIES</text>
    <text x="130" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.2" fill="#4E285F">Détente · Sérénité · Équilibre</text>
    <line x1="62" y1="248" x2="198" y2="248" stroke="#DDD0EC" stroke-width="0.6"/>
    <text x="130" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.2" fill="#5B3A24">Vitamines B6 · Camomille · Mélisse</text>
    <text x="130" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.2" fill="#B58BD6" font-weight="bold">60 GUMMIES · FRUITS ROUGES</text>
    <text x="130" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.8" fill="#6F8B61">Complément alimentaire</text>

    <!-- Jar base -->
    <ellipse cx="130" cy="303" rx="88" ry="9" fill="#C0B8B0" opacity="0.35"/>
  </g>

  <!-- Label: Détente & Plaisir -->
  <rect x="375" y="418" width="145" height="26" rx="13" fill="#B58BD6" opacity="0.2"/>
  <rect x="375" y="418" width="145" height="26" rx="13" fill="none" stroke="#B58BD6" stroke-width="1"/>
  <text x="447" y="435" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4E285F" font-style="italic">Détente &amp; Plaisir</text>
</svg>
