<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jar-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A4A18"/>
      <stop offset="25%" stop-color="#A86830"/>
      <stop offset="65%" stop-color="#9A5E28"/>
      <stop offset="100%" stop-color="#7A4A18"/>
    </linearGradient>
    <linearGradient id="wax" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE5D5"/>
    </linearGradient>
    <linearGradient id="flame-g" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E9CF62"/>
      <stop offset="40%" stop-color="#F0A020"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#E9CF62" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E9CF62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="label-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="100%" stop-color="#EFE8D8"/>
    </linearGradient>
    <radialGradient id="jar-shine" cx="25%" cy="20%" r="45%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Lavender decorative -->
  <text x="42" y="130" font-size="22" opacity="0.6">💜</text>
  <text x="230" y="125" font-size="20" opacity="0.55">🌿</text>
  <text x="55" y="300" font-size="16" opacity="0.5">🌸</text>
  <text x="228" y="305" font-size="18" opacity="0.55">💜</text>

  <!-- Candle glow behind flame -->
  <ellipse cx="150" cy="118" rx="45" ry="35" fill="url(#glow)"/>

  <!-- Flame -->
  <path d="M150 54 Q138 72 140 88 Q142 102 150 108 Q158 102 160 88 Q162 72 150 54Z" fill="url(#flame-g)" opacity="0.95"/>
  <path d="M150 68 Q145 78 146 88 Q147 97 150 101 Q153 97 154 88 Q155 78 150 68Z" fill="#FFF5CC" opacity="0.7"/>

  <!-- Wick -->
  <line x1="150" y1="106" x2="150" y2="122" stroke="#5B3A24" stroke-width="2" stroke-linecap="round"/>

  <!-- Wax surface -->
  <ellipse cx="150" cy="124" rx="72" ry="13" fill="url(#wax)"/>
  <ellipse cx="150" cy="122" rx="60" ry="9" fill="#F8F2E4"/>

  <!-- Jar body (amber glass) -->
  <rect x="78" y="130" width="144" height="175" rx="12" fill="url(#jar-amber)"/>
  <rect x="78" y="130" width="144" height="175" rx="12" fill="url(#jar-shine)"/>
  <!-- Shine strip -->
  <rect x="85" y="138" width="16" height="155" rx="8" fill="white" opacity="0.1"/>

  <!-- Label -->
  <rect x="88" y="152" width="124" height="120" rx="7" fill="url(#label-c)" opacity="0.94"/>
  <rect x="88" y="152" width="124" height="120" rx="7" fill="none" stroke="#E9CF62" stroke-width="1.5"/>
  <rect x="92" y="156" width="116" height="112" rx="5" fill="none" stroke="#E9CF62" stroke-width="0.4" stroke-dasharray="2,3"/>

  <!-- Candle icon -->
  <text x="150" y="178" text-anchor="middle" font-size="14">🕯️</text>

  <!-- Zenia -->
  <text x="150" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#5B3A24" font-style="italic" font-weight="bold">Zenia</text>
  <line x1="96" y1="200" x2="204" y2="200" stroke="#E9CF62" stroke-width="0.8"/>

  <!-- Product name -->
  <text x="150" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#25221D" font-weight="bold" letter-spacing="1">BOUGIES</text>
  <text x="150" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#25221D" font-weight="bold" letter-spacing="1">NATURELLES</text>
  <line x1="96" y1="231" x2="204" y2="231" stroke="#EDE0C0" stroke-width="0.5"/>

  <text x="150" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.2" fill="#5B3A24">Lavande · Camomille · Cèdre</text>
  <text x="150" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.2" fill="#5B3A24">Pour décrocher et souffler</text>

  <!-- Badge -->
  <rect x="110" y="261" width="80" height="12" rx="6" fill="#E9CF62" opacity="0.3"/>
  <rect x="110" y="261" width="80" height="12" rx="6" fill="none" stroke="#E9CF62" stroke-width="0.8"/>
  <text x="150" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#5B3A24" font-weight="bold">CIRE VÉGÉTALE NATURELLE</text>

  <!-- Jar bottom -->
  <ellipse cx="150" cy="305" rx="72" ry="10" fill="#5A3510" opacity="0.5"/>
</svg>
