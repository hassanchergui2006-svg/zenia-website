<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottle-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#174326"/>
    </linearGradient>
    <linearGradient id="bottle-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1008"/>
      <stop offset="25%" stop-color="#3D2410"/>
      <stop offset="60%" stop-color="#4A2E18"/>
      <stop offset="100%" stop-color="#1C1008"/>
    </linearGradient>
    <linearGradient id="label-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F5EE"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cap-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A8A5D"/>
      <stop offset="40%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#1A3D28"/>
    </linearGradient>
    <linearGradient id="bio-badge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#174326"/>
    </linearGradient>
  </defs>

  <!-- Capsules scattered at bottom -->
  <ellipse cx="82" cy="390" rx="22" ry="9" fill="#DDE8D2" transform="rotate(-30 82 390)" opacity="0.9"/>
  <ellipse cx="112" cy="400" rx="22" ry="9" fill="#E9CF62" transform="rotate(15 112 400)" opacity="0.85"/>
  <ellipse cx="148" cy="395" rx="22" ry="9" fill="#DDE8D2" transform="rotate(-5 148 395)" opacity="0.9"/>
  <ellipse cx="185" cy="403" rx="22" ry="9" fill="#E9CF62" transform="rotate(25 185 403)" opacity="0.85"/>
  <ellipse cx="218" cy="392" rx="22" ry="9" fill="#DDE8D2" transform="rotate(-20 218 392)" opacity="0.9"/>

  <!-- Bottle neck -->
  <rect x="118" y="62" width="64" height="48" rx="6" fill="url(#bottle-body)"/>

  <!-- Cap -->
  <rect x="108" y="34" width="84" height="38" rx="10" fill="url(#cap-shine)"/>
  <ellipse cx="150" cy="34" rx="42" ry="9" fill="#4A8A5D"/>
  <!-- Cap ridge -->
  <rect x="112" y="53" width="76" height="6" rx="3" fill="#1A3D28" opacity="0.4"/>

  <!-- Bottle body -->
  <rect x="80" y="106" width="140" height="260" rx="18" fill="url(#bottle-body)"/>

  <!-- Shine on bottle -->
  <rect x="80" y="106" width="140" height="260" rx="18" fill="url(#shine)"/>
  <rect x="88" y="114" width="22" height="230" rx="11" fill="white" opacity="0.06"/>

  <!-- Label -->
  <rect x="90" y="130" width="120" height="180" rx="8" fill="url(#label-bg)"/>
  <rect x="90" y="130" width="120" height="180" rx="8" fill="none" stroke="#6F8B61" stroke-width="1.5"/>
  <!-- Label inner border -->
  <rect x="94" y="134" width="112" height="172" rx="6" fill="none" stroke="#6F8B61" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Leaf icon -->
  <text x="150" y="156" text-anchor="middle" font-size="14" fill="#174326">🌿</text>

  <!-- Zenia -->
  <text x="150" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#174326" font-style="italic" font-weight="bold" letter-spacing="1">Zenia</text>

  <!-- Divider -->
  <line x1="100" y1="179" x2="200" y2="179" stroke="#6F8B61" stroke-width="0.8"/>

  <!-- Product name -->
  <text x="150" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#25221D" font-weight="bold" letter-spacing="1.5">CAPSULES</text>
  <text x="150" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#25221D" font-weight="bold" letter-spacing="1.5">ANTI-STRESS</text>

  <!-- Divider -->
  <line x1="100" y1="213" x2="200" y2="213" stroke="#DDE8D2" stroke-width="0.6"/>

  <!-- Description -->
  <text x="150" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" fill="#5B3A24">À base d'ashwagandha,</text>
  <text x="150" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" fill="#5B3A24">rhodiola et passiflore</text>

  <!-- Benefit icons row -->
  <circle cx="114" cy="258" r="14" fill="#DDE8D2"/>
  <text x="114" y="263" text-anchor="middle" font-size="10">😌</text>
  <circle cx="150" cy="258" r="14" fill="#DDE8D2"/>
  <text x="150" y="263" text-anchor="middle" font-size="10">🧠</text>
  <circle cx="186" cy="258" r="14" fill="#DDE8D2"/>
  <text x="186" y="263" text-anchor="middle" font-size="10">🌙</text>

  <!-- 100% Naturel badge -->
  <rect x="97" y="277" width="106" height="17" rx="8" fill="url(#bio-badge)"/>
  <text x="150" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#F7F0E6" font-weight="bold" letter-spacing="0.8">100% NATUREL &amp; BIO</text>

  <!-- 60 capsules -->
  <text x="150" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#6F8B61" font-weight="bold">60 CAPSULES</text>
  <text x="150" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#5B3A24">Complément alimentaire</text>
</svg>
